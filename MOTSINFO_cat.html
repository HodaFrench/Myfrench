<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My French</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#202124;--grey:#5f6368;--faint:#80868b;--line:#dadce0;--line-2:#e8eaed;--mist:#f8f9fa}
  *{margin:0;padding:0;box-sizing:border-box}
  *{-webkit-user-select:none;user-select:none}input,textarea{user-select:text}img{pointer-events:none}
  body{font-family:'Lexend',Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.6;padding:0 0 60px;-webkit-font-smoothing:antialiased}
  svg{display:block}a{text-decoration:none;color:inherit}
  .top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;padding:0 20px;height:60px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;flex:none}
  .brand .mark i{display:block}
  .brand .mark i:nth-child(1){background:#1a73e8}.brand .mark i:nth-child(2){background:#ea4335}
  .brand .mark i:nth-child(3){background:#f9a825}.brand .mark i:nth-child(4){background:#1e8e3e}
  .brand b{font-weight:700;font-size:16.5px;letter-spacing:-.3px}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#f1f3f4;color:#3c4043;border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
  .back:hover{background:#e8eaed}.back svg{width:16px;height:16px}
  .chero{text-align:center;padding:32px 20px 10px;max-width:680px;margin:0 auto}
  .cic{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:0 6px 18px rgba(60,64,67,.18)}
  .cic svg{width:30px;height:30px}
  .cname{font-size:25px;font-weight:500;letter-spacing:-.4px}
  .cdesc{font-size:14px;color:var(--grey);margin-top:6px}
  .list{max-width:680px;margin:0 auto;padding:18px 16px}
  .lesson{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;transition:box-shadow .16s,transform .16s,border-color .16s}
  .lesson:hover{box-shadow:0 2px 8px rgba(60,64,67,.14),0 6px 18px rgba(60,64,67,.10);transform:translateY(-2px);border-color:var(--line)}
  .lnum{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:17px}
  .linfo{flex:1;min-width:0}
  .lt{font-size:16px;font-weight:500;line-height:1.4;direction:ltr}
  .lf{font-size:11.5px;color:var(--grey);direction:ltr;text-align:left;margin-top:1px}
  .lfa{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;text-align:right;font-size:12px;color:var(--faint);margin-top:2px}
  .lv{display:inline-block;font-size:10.5px;font-weight:500;margin-top:5px;padding:2px 10px;border-radius:999px;background:var(--mist);border:1px solid var(--line-2);color:var(--grey)}
  .larr{flex:none;color:var(--faint)}.larr svg{width:20px;height:20px}
  .empty{text-align:center;padding:50px 24px;color:var(--grey)}
  .foot{text-align:center;font-size:13px;color:var(--faint);margin:16px 20px 0;padding:12px;line-height:1.9}
  .foot b{color:var(--grey);font-weight:500}
  :focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="index.html"><span class="mark"><i></i><i></i><i></i><i></i></span><b>My French</b></a>
    <a class="back" href="MOTSINFO_index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Les thèmes</a>
  </div>
  <div class="chero">
    <div class="cic" id="cic"></div>
    <div class="cname" id="cname">…</div>
    <div class="cdesc" id="cdesc"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="foot">Ouvrez une leçon pour découvrir ses mots.<br><b>Chaque leçon</b> contient 10 mots avec définition, sens et exemple B2.</div>

<script src="data.js"></script>
<script>
var BOOK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.2-3.5-2-6-2v13c2.5 0 4.5.8 6 2M12 6c1.5-1.2 3.5-2 6-2v13c-2.5 0-4.5.8-6 2M12 6v13"/></svg>';
var ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var META={
 ecole:{fr:"L'école",desc:"Éducation, notes et classe",c:'#1a73e8'},
 travail:{fr:"Le travail",desc:"Emploi, métier et milieu professionnel",c:'#d93025'},
 loisirs:{fr:"Loisirs & culture",desc:"Cuisine, séries, cinéma et livres",c:'#9334e6'},
 tourisme:{fr:"Le tourisme",desc:"Voyage, destinations et patrimoine",c:'#12a4b4'},
 consommation:{fr:"La consommation",desc:"Achats, argent et consommation",c:'#e8710a'},
 relations:{fr:"Les relations",desc:"Famille et relations humaines",c:'#d01884'},
 transports:{fr:"Les transports",desc:"Mobilité et véhicules",c:'#1e8e3e'},
 environnement:{fr:"L'environnement",desc:"Nature et climat",c:'#0f9d58'},
 sante:{fr:"La santé",desc:"Nutrition, sommeil et santé mentale",c:'#f9a825'},
 medias:{fr:"Les médias",desc:"Internet, réseaux et numérique",c:'#3f51b5'}
};
function q(k){var m=(window.location.search||'').match(new RegExp(k+'=([a-z_]+)'));return m?m[1]:null;}
function clean(t){return (t||'').replace(/[📐📚✍️🎧📰🗼🎯🎙️📸👤🟢🔵🟣🗞️🗂️📄📝📗🏫💼🎭✈️🛒🚲🌿❤️📱]/g,'').trim();}
function build(){
  var cat=q('cat');
  if(!cat){try{cat=sessionStorage.getItem('mi_cat');}catch(e){}}
  var meta=META[cat]||{fr:'Thème',desc:'',c:'#1a73e8'};
  document.getElementById('cic').style.background=meta.c;
  document.getElementById('cic').innerHTML=BOOK;
  document.getElementById('cname').textContent=meta.fr;
  document.getElementById('cdesc').textContent=meta.desc;
  document.title=meta.fr+" — Les mots de l'info";
  var items=(typeof LESSONS!=='undefined')?LESSONS.filter(function(l){return l.category==='vocab'&&l.sub==='mots_info'&&l.cat2===cat;}):[];
  var list=document.getElementById('list');
  if(!items.length){list.innerHTML='<div class="empty">Ce thème sera bientôt disponible.</div>';return;}
  list.innerHTML=items.map(function(l,i){
    var t=l.titleFr||clean(l.title);
    var fr=l.title?('<div class="lfa">'+clean(l.title)+'</div>'):'';
    var lv=l.level?('<span class="lv">'+l.level+'</span>'):'';
    return '<a class="lesson" href="'+(l.file||'#')+'"><div class="lnum" style="background:'+meta.c+'">'+(i+1)+'</div>'+
      '<div class="linfo"><div class="lt">'+t+'</div>'+fr+lv+'</div><div class="larr">'+ARR+'</div></a>';
  }).join('');
}
window.addEventListener('DOMContentLoaded',build);
</script>
<script>(function(){document.addEventListener("contextmenu",function(e){e.preventDefault();},{capture:true});})();</script>
</body></html>
