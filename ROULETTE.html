 .brand{display:flex;align-items:center;gap:11px}
 .brand .mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;flex:none}
 .brand .mark i{display:block}

 .back:hover{background:#e8eaed}.back svg{width:16px;height:16px}
 .hero{max-width:640px;margin:0 auto;padding:36px 20px 4px}

 .hero p{font-size:17px;color:var(--grey);margin-top:8px}
 .tabs{display:inline-flex;gap:4px;background:var(--mist);border:1px solid var(--line2);border-radius:12px;padding:5px;margin:22px auto 0}

 .tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(60,64,67,.16)}
 .wheelwrap{position:relative;width:min(340px,84vw);margin:32px auto 0}
 .ptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:24px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
 #wheel{display:block;margin:0 auto;filter:drop-shadow(0 8px 26px rgba(60,64,67,.22));border-radius:50%}
 .spin{margin:30px auto 0;display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;border:none;border-radius:16px;font-family:inherit;font-size:19px;font-weight:600;padding:17px 52px;cursor:pointer;transition:background .15s,box-shadow .15s,transform .1s;box-shadow:0 4px 16px rgba(26,115,232,.35)}
 .spin:hover{background:var(--blue-d);box-shadow:0 6px 22px rgba(26,115,232,.45)}
 .spin:active{transform:scale(.97)}
 .spin:disabled{opacity:.7;cursor:default}
 .rc{max-width:600px;margin:34px auto 0;padding:0 20px;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none}
 .rc.show{opacity:1;transform:none;pointer-events:auto}

 .rfa{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;font-size:16px;color:var(--grey);margin-top:8px}
 .vh{margin-top:22px;padding-top:20px;border-top:1px solid var(--line2)}
 .vht{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:12px}

 .foot{font-size:13px;color:var(--faint);margin-top:32px}
 :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
 @media(prefers-reduced-motion:reduce){*{transition:none!important}}

function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var mode='w', SIZE=Math.min(340, Math.floor(window.innerWidth*0.84)), DPR=window.devicePixelRatio||1, N=12;
var cv=document.getElementById('wheel'), ctx=cv.getContext('2d');
function setupCanvas(){SIZE=Math.min(340,Math.floor(window.innerWidth*0.84));cv.width=SIZE*DPR;cv.height=SIZE*DPR;cv.style.width=SIZE+'px';cv.style.height=SIZE+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
function sample(arr,k){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a.slice(0,k);}
var wheelItems=[], angle=0, spinning=false;
function newWheel(){wheelItems=sample(mode==='w'?W:S,N);drawWheel(angle);}
function drawWheel(a){
 ctx.clearRect(0,0,SIZE,SIZE);
 var cx=SIZE/2,r=SIZE/2-4,arc=2*Math.PI/N;
 for(var i=0;i<N;i++){
  var s=a+i*arc,e=s+arc;
  ctx.beginPath();ctx.moveTo(cx,cx);ctx.arc(cx,cx,r,s,e);ctx.closePath();
  ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(cx,cx);ctx.rotate(s+arc/2);
  ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font="600 "+(SIZE>300?13:11)+"px 'Lexend',sans-serif";
  var nm=wheelItems[i][0];if(nm.length>15)nm=nm.slice(0,14)+'…';
  ctx.fillText(nm,r-14,4);ctx.restore();
 }
 ctx.beginPath();ctx.arc(cx,cx,SIZE*0.085,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#e8eaed';ctx.lineWidth=2;ctx.stroke();
}
function spin(){
 if(spinning)return;spinning=true;
 var btn=document.getElementById('spin');btn.disabled=true;btn.textContent='En cours…';
 document.getElementById('rc').classList.remove('show');
 newWheel();
 var target=angle+(5+Math.random()*4)*2*Math.PI+Math.random()*2*Math.PI;
 var dur=3300+Math.random()*1200,t0=performance.now(),a0=angle;
 function anim(t){
  var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);
  angle=a0+(target-a0)*e;drawWheel(angle);
  if(p<1){requestAnimationFrame(anim);}
  else{spinning=false;btn.disabled=false;btn.textContent='Tourner';
   var arc=2*Math.PI/N,rel=((1.5*Math.PI-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
   var k=Math.floor(rel/arc)%N;showResult(wheelItems[k]);}
 }
 requestAnimationFrame(anim);
}
function showResult(it){
 document.getElementById('r-topic').textContent=it[0];
 document.getElementById('r-fa').textContent=it[1];
 var vg=document.getElementById('r-vocab-grid');
 if(it[2]&&it[2].length){vg.innerHTML=it[2].map(function(v){return '<span class="chip">'+esc(v)+'</span>';}).join('');document.getElementById('r-vocab').style.display='block';}
 else document.getElementById('r-vocab').style.display='none';
 var rc=document.getElementById('rc');rc.classList.add('show');
 setTimeout(function(){rc.scrollIntoView({behavior:'smooth',block:'center'});},80);
}
function setMode(m){mode=m;document.getElementById('tw').classList.toggle('on',m==='w');document.getElementById('ts').classList.toggle('on',m==='s');document.getElementById('rc').classList.remove('show');newWheel();}
setupCanvas();newWheel();
window.addEventListener('resize',function(){setupCanvas();drawWheel(angle);});
