<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les mots de l'info — My French</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#202124;--grey:#5f6368;--faint:#80868b;--line:#dadce0;--line-2:#e8eaed;--mist:#f8f9fa}
  *{margin:0;padding:0;box-sizing:border-box}
  *{-webkit-user-select:none;user-select:none}input,textarea{user-select:text}img{pointer-events:none}
  body{font-family:'Lexend',Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.6;padding:0 0 60px;-webkit-font-smoothing:antialiased}
  svg{display:block}a{text-decoration:none;color:inherit}
  .top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;padding:0 20px;height:60px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;flex:none}
  .brand .mark i{display:block}
  .brand .mark i:nth-child(1){background:#1a73e8}.brand .mark i:nth-child(2){background:#ea4335}
  .brand .mark i:nth-child(3){background:#f9a825}.brand .mark i:nth-child(4){background:#1e8e3e}
  .brand b{font-weight:700;font-size:16.5px;letter-spacing:-.3px}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#f1f3f4;color:#3c4043;border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
  .back:hover{background:#e8eaed}.back svg{width:16px;height:16px}
  .hero{text-align:center;padding:34px 20px 8px;max-width:680px;margin:0 auto}
  .hero .ic{width:60px;height:60px;border-radius:16px;background:#1a73e8;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:0 6px 18px rgba(26,115,232,.3)}
  .hero .ic svg{width:30px;height:30px}
  .hero h1{font-size:26px;font-weight:500;letter-spacing:-.4px}
  .hero p{color:var(--grey);font-size:15px;margin-top:8px}
  .grid{max-width:720px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line-2);border-radius:16px;padding:16px;cursor:pointer;transition:box-shadow .16s,transform .16s,border-color .16s}
  .card:hover{box-shadow:0 2px 8px rgba(60,64,67,.14),0 6px 18px rgba(60,64,67,.10);transform:translateY(-2px);border-color:var(--line)}
  .cic{flex:none;width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
  .cic svg{width:24px;height:24px}
  .cinfo{flex:1;min-width:0}
  .cname{font-size:16px;font-weight:500;letter-spacing:-.2px}
  .cdesc{font-size:12px;color:var(--faint);margin-top:1px}
  .ccnt{font-size:11.5px;font-weight:500;margin-top:5px;display:inline-block;padding:2px 10px;border-radius:999px;background:var(--mist);border:1px solid var(--line-2);color:var(--grey)}
  .foot{text-align:center;font-size:13px;color:var(--faint);margin:16px 20px 0;padding:12px;line-height:1.9}
  .foot b{color:var(--grey);font-weight:500}
  :focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="index.html"><span class="mark"><i></i><i></i><i></i><i></i></span><b>My French</b></a>
    <a class="back" href="CAT.html?cat=vocab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Retour</a>
  </div>
  <div class="hero">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 01-2-2zM17 8h3v9a2 2 0 01-2 2M7 9h7M7 13h7M7 17h4"/></svg></div>
    <h1>Les mots de l'info</h1>
    <p>Le vocabulaire de l'actualité, thème par thème.</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">Choisissez un thème pour ouvrir ses leçons.<br><b>Chaque leçon</b> contient 10 mots-clés avec définition, sens et exemple.</div>

<script src="data.js"></script>
<script>
var BOOK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.2-3.5-2-6-2v13c2.5 0 4.5.8 6 2M12 6c1.5-1.2 3.5-2 6-2v13c-2.5 0-4.5.8-6 2M12 6v13"/></svg>';
var CATS=[
 {id:'ecole',fr:"L'école",desc:"Éducation, notes et classe",c:'#1a73e8'},
 {id:'travail',fr:"Le travail",desc:"Emploi, métier et milieu pro",c:'#d93025'},
 {id:'loisirs',fr:"Loisirs & culture",desc:"Cuisine, séries, cinéma, livres",c:'#9334e6'},
 {id:'tourisme',fr:"Le tourisme",desc:"Voyage, destinations, patrimoine",c:'#12a4b4'},
 {id:'consommation',fr:"La consommation",desc:"Achats, argent et consommation",c:'#e8710a'},
 {id:'relations',fr:"Les relations",desc:"Famille et relations humaines",c:'#d01884'},
 {id:'transports',fr:"Les transports",desc:"Mobilité et véhicules",c:'#1e8e3e'},
 {id:'environnement',fr:"L'environnement",desc:"Nature et climat",c:'#0f9d58'},
 {id:'sante',fr:"La santé",desc:"Nutrition, sommeil, santé mentale",c:'#f9a825'},
 {id:'medias',fr:"Les médias",desc:"Internet, réseaux et numérique",c:'#3f51b5'}
];
function count(cat){try{return (typeof LESSONS!=='undefined'?LESSONS.filter(function(l){return l.category==='vocab'&&l.sub==='mots_info'&&l.cat2===cat;}).length:0);}catch(e){return 0;}}
function goCat(cat){try{sessionStorage.setItem('mi_cat',cat);}catch(e){}window.location.href='MOTSINFO_cat.html?cat='+cat;}
function render(){
  document.getElementById('grid').innerHTML=CATS.map(function(c){
    var n=count(c.id);
    return '<div class="card" onclick="goCat(\''+c.id+'\')">'+
      '<div class="cic" style="background:'+c.c+'">'+BOOK+'</div>'+
      '<div class="cinfo"><div class="cname">'+c.fr+'</div><div class="cdesc">'+c.desc+'</div>'+
      '<span class="ccnt">'+(n>0?n+' leçons':'Bientôt')+'</span></div></div>';
  }).join('');
}
window.addEventListener('DOMContentLoaded',render);
</script>
<script>(function(){document.addEventListener("contextmenu",function(e){e.preventDefault();},{capture:true});})();</script>
</body></html>
