<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — My French</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1a73e8;--blue-d:#1660cf;--red:#ea4335;--green:#1e8e3e;--amber:#f9a825;
    --ink:#202124;--grey:#5f6368;--faint:#80868b;--line:#dadce0;--line-2:#e8eaed;--mist:#f8f9fa}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Lexend',Arial,sans-serif;color:var(--ink);background:var(--mist);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  svg{display:block}
  .auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line-2);border-radius:20px;
    padding:36px 32px 30px;box-shadow:0 1px 3px rgba(60,64,67,.1),0 8px 28px rgba(60,64,67,.10)}
  .alogo{text-align:center;margin-bottom:26px}
  .alogo .mark{width:44px;height:44px;border-radius:12px;display:inline-grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;margin-bottom:14px}
  .alogo .mark i{display:block}
  .alogo .mark i:nth-child(1){background:var(--blue)}.alogo .mark i:nth-child(2){background:var(--red)}
  .alogo .mark i:nth-child(3){background:var(--amber)}.alogo .mark i:nth-child(4){background:var(--green)}
  .alogo h2{font-size:22px;font-weight:500;letter-spacing:-.4px}
  .alogo p{font-size:14px;color:var(--grey);margin-top:5px}
  .atabs{display:flex;gap:4px;background:var(--mist);border:1px solid var(--line-2);border-radius:12px;padding:4px;margin-bottom:24px}
  .atab{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:var(--grey);
    padding:10px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
  .atab.active{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(60,64,67,.14)}
  .aform{display:flex;flex-direction:column;gap:16px}
  .afield{display:flex;flex-direction:column;gap:6px}
  .afield label{font-size:13px;font-weight:500;color:var(--grey)}
  .afield input{font-family:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
  .afield input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
  .afield input::placeholder{color:var(--faint)}
  .amsg{display:none;font-size:13px;color:#c5221f;background:#fce8e6;border:1px solid #f5c6c6;border-radius:8px;padding:9px 13px;line-height:1.5}
  .amsg.show{display:block}
  .abtn{font-family:inherit;font-size:15px;font-weight:500;color:#fff;background:var(--blue);border:none;border-radius:10px;
    padding:13px;cursor:pointer;transition:background .15s,box-shadow .15s;margin-top:2px}
  .abtn:hover{background:var(--blue-d);box-shadow:0 1px 6px rgba(26,115,232,.4)}
  .abtn:disabled{opacity:.6;cursor:default}
  .ahint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:2px;line-height:1.6}
  .aconfirm{display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;
    background:#e6f4ea;border:1px solid #ceead6;border-radius:12px;padding:18px 16px;color:#137333;font-size:13.5px;line-height:1.7}
  .aconfirm.show{display:flex}
  .aconfirm .cicon{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
  .aconfirm .cicon svg{width:22px;height:22px}
  .aconfirm b{color:#0b5a27;word-break:break-all}
  .afoot{text-align:center;margin-top:22px;font-size:12px;color:var(--faint)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="auth-card">
    <div class="alogo">
      <span class="mark"><i></i><i></i><i></i><i></i></span>
      <h2>My French</h2>
      <p>Bienvenue dans la communauté</p>
    </div>
    <div class="atabs">
      <button class="atab active" onclick="st('login')">Se connecter</button>
      <button class="atab" onclick="st('signup')">Créer un compte</button>
    </div>

    <div id="lf" class="aform">
      <div class="afield"><label>E-mail</label><input type="email" id="le" placeholder="nom@gmail.com" autocomplete="email"></div>
      <div class="afield"><label>Mot de passe</label><input type="password" id="lp" placeholder="••••••" autocomplete="current-password"></div>
      <div class="amsg" id="lm"></div>
      <button class="abtn" id="lb" onclick="doLogin()">Continuer</button>
      <p class="ahint">Pas encore de compte ? Choisissez « Créer un compte ».</p>
    </div>

    <div id="sf" class="aform" style="display:none">
      <div class="afield"><label>E-mail</label><input type="email" id="se" placeholder="nom@gmail.com" autocomplete="email"></div>
      <div class="afield"><label>Mot de passe</label><input type="password" id="sp" placeholder="Au moins 6 caractères" autocomplete="new-password"></div>
      <div class="afield"><label>Confirmer le mot de passe</label><input type="password" id="sp2" placeholder="••••••" autocomplete="new-password"></div>
      <div class="amsg" id="sm"></div>
      <div class="aconfirm" id="cb">
        <div class="cicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <p>Un e-mail de confirmation a été envoyé à <b id="ce"></b>.<br>Ouvrez le lien reçu pour activer votre compte.</p>
      </div>
      <button class="abtn" id="sb" onclick="doSignup()">Commencer</button>
      <p class="ahint">Déjà inscrit ? Choisissez « Se connecter ».</p>
    </div>

    <div class="afoot">My French</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://ifjsnasoxnalhttzhlpd.supabase.co','sb_publishable_3aBoJ8PEPsrnOpgR_vOG4A_NDfJd6cK');
sb.auth.getSession().then(({data:{session}})=>{if(session)window.location.href='index.html';});
function st(t){document.getElementById('lf').style.display=t==='login'?'flex':'none';document.getElementById('sf').style.display=t==='signup'?'flex':'none';document.querySelectorAll('.atab').forEach((el,i)=>el.classList.toggle('active',(t==='login'&&i===0)||(t==='signup'&&i===1)));}
function sm(id,txt){const el=document.getElementById(id);el.textContent=txt;el.className='amsg show';}
function sl(id,on){const b=document.getElementById(id);b.disabled=on;b.textContent=on?'…':(id==='lb'?'Continuer':'Commencer');}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(e);}
function frErr(msg){msg=(msg||'').toLowerCase();
 if(msg.includes('invalid')&&msg.includes('email'))return"Adresse e-mail invalide, ex : nom@gmail.com";
 if(msg.includes('already')||msg.includes('registered')||msg.includes('exists'))return"Cet e-mail est déjà inscrit. Connectez-vous.";
 if(msg.includes('password')&&msg.includes('6'))return"Le mot de passe doit contenir au moins 6 caractères";
 if(msg.includes('weak')||msg.includes('password'))return"Mot de passe trop faible, choisissez-en un plus fort";
 if(msg.includes('rate')||msg.includes('many'))return"Trop de tentatives, réessayez dans un instant";
 if(msg.includes('network')||msg.includes('fetch')||msg.includes('failed'))return"Vérifiez votre connexion et réessayez";
 if(msg.includes('not confirmed'))return"Confirmez d'abord votre e-mail";
 return msg?('Erreur : '+msg):"Un problème est survenu, réessayez";}
async function doSignup(){const e=document.getElementById('se').value.trim().toLowerCase();const p=document.getElementById('sp').value;const p2=document.getElementById('sp2').value;
 if(!e||!p)return sm('sm','Veuillez remplir tous les champs');
 if(!validEmail(e))return sm('sm','Adresse e-mail invalide, ex : nom@gmail.com');
 if(p.length<6)return sm('sm','Le mot de passe doit contenir au moins 6 caractères');
 if(p!==p2)return sm('sm','Les mots de passe ne correspondent pas');
 sl('sb',true);
 try{const {data,error}=await sb.auth.signUp({email:e,password:p});sl('sb',false);
  if(error)return sm('sm',frErr(error.message));
  if(data&&data.user&&data.user.identities&&data.user.identities.length===0)return sm('sm','Cet e-mail est déjà inscrit. Connectez-vous.');
  if(data&&data.session){window.location.href='index.html';return;}
  document.getElementById('ce').textContent=e;document.getElementById('cb').classList.add('show');document.getElementById('sb').style.display='none';
 }catch(ex){sl('sb',false);sm('sm',frErr(ex.message||''));}}
async function doLogin(){const e=document.getElementById('le').value.trim().toLowerCase();const p=document.getElementById('lp').value;
 if(!e||!p)return sm('lm','Veuillez remplir tous les champs');
 if(!validEmail(e))return sm('lm','Adresse e-mail invalide, ex : nom@gmail.com');
 sl('lb',true);
 try{const {error}=await sb.auth.signInWithPassword({email:e,password:p});sl('lb',false);
  if(error){const m=(error.message||'').toLowerCase();
   if(m.includes('not confirmed'))return sm('lm','Confirmez votre e-mail (vérifiez aussi les spams).');
   if(m.includes('invalid')&&m.includes('credential'))return sm('lm','E-mail ou mot de passe incorrect');
   if(m.includes('invalid')&&m.includes('email'))return sm('lm','Adresse e-mail invalide');
   return sm('lm','E-mail ou mot de passe incorrect');}
  window.location.href='index.html';
 }catch(ex){sl('lb',false);sm('lm','Un problème est survenu, vérifiez votre connexion.');}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(document.getElementById('lf').style.display!=='none')doLogin();else doSignup();}});
</script>
</body>
</html>
