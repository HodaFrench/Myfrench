<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expressions françaises — Français avec Hoda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 :root{--blue:#1a73e8;--purple:#9334e6;--ink:#202124;--grey:#5f6368;--faint:#80868b;--line:#dadce0;--line2:#e8eaed;--mist:#f8f9fa}
 *{margin:0;padding:0;box-sizing:border-box}*{-webkit-user-select:none;user-select:none}input{user-select:text}
 body{font-family:'Lexend',Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.6;padding:0 0 70px;-webkit-font-smoothing:antialiased}
 svg{display:block}a{text-decoration:none;color:inherit}
 .top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;padding:0 20px;height:60px}
 .brand{display:flex;align-items:center;gap:11px}
 .brand .mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;flex:none}
 .brand .mark i{display:block}
 .brand .mark i:nth-child(1){background:var(--blue)}.brand .mark i:nth-child(2){background:#ea4335}.brand .mark i:nth-child(3){background:#f9a825}.brand .mark i:nth-child(4){background:#1e8e3e}
 .brand b{font-weight:700;font-size:17px;letter-spacing:-.3px}
 .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#f1f3f4;color:#3c4043;border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
 .back:hover{background:#e8eaed}.back svg{width:16px;height:16px}
 .hero{max-width:720px;margin:0 auto;padding:38px 20px 6px;text-align:center}
 .hero h1{font-size:40px;font-weight:600;letter-spacing:-1px}
 .hero p{font-size:17px;color:var(--grey);margin-top:8px}
 .bar{max-width:720px;margin:22px auto 0;padding:0 20px;display:flex;gap:12px;align-items:center}
 .box{flex:1;display:flex;align-items:center;gap:12px;height:52px;border:1px solid var(--line);border-radius:26px;padding:0 20px;transition:box-shadow .2s,border-color .2s}
 .box:focus-within{box-shadow:0 1px 8px rgba(32,33,36,.2);border-color:transparent}
 .box svg{color:var(--faint);flex:none}.box input{border:none;outline:none;flex:1;font-family:inherit;font-size:16px;background:transparent}
 .expand{background:#f1f3f4;border:none;border-radius:10px;padding:0 16px;height:44px;font-family:inherit;font-size:13.5px;font-weight:500;color:#3c4043;cursor:pointer;white-space:nowrap}
 .expand:hover{background:#e8eaed}
 .wrap{max-width:720px;margin:18px auto 0;padding:0 20px}
 .ecard{background:#fff;border:1px solid var(--line2);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,64,67,.06);overflow:hidden}
 .ehead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;background:none;border:none;cursor:pointer;padding:18px 20px;text-align:left;font-family:inherit}
 .efr{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.3px;direction:ltr}
 .echev{flex:none;color:var(--faint);transition:transform .2s}
 .echev svg{width:20px;height:20px}
 .ecard.open .echev{transform:rotate(90deg)}
 .ebody{display:none;padding:0 20px 20px}
 .ecard.open .ebody{display:block}
 .elit{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;text-align:right;font-size:13px;color:var(--faint);margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
 .elit .lbl{font-family:'Lexend',sans-serif;direction:ltr;display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);background:#f4e8fd;border-radius:5px;padding:2px 7px;margin-left:7px}
 .emean{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;text-align:right;font-size:14.5px;color:#3c4043;line-height:1.95}
 .emean b{color:var(--blue);font-weight:600}
 .exs{margin-top:16px;display:flex;flex-direction:column;gap:12px}
 .exrow{border-right:3px solid #e8f0fe;padding-right:12px}
 .exfr{font-size:16px;font-weight:500;color:var(--ink);direction:ltr;line-height:1.5}
 .exfa{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;text-align:right;font-size:12.5px;color:var(--grey);margin-top:3px}
 .enote{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;text-align:right;font-size:12.5px;color:var(--faint);background:var(--mist);border-radius:9px;padding:9px 13px;margin-top:14px;line-height:1.8}
 .foot{text-align:center;font-size:13px;color:var(--faint);margin-top:30px}
 :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
 @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 <div class="top">

  <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Accueil</a>
 </div>
 <div class="hero"><h1>Expressions françaises</h1><p>Les expressions imagées du quotidien, avec le sens et des exemples.</p></div>
 <div class="bar">
  <div class="box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
   <input id="q" type="text" placeholder="Rechercher une expression…" autocomplete="off"></div>
  <button class="expand" id="exp" onclick="toggleAll()">Tout déplier</button>
 </div>
 <div class="wrap" id="wrap"></div>
 <div class="foot">Français avec Hoda</div>
<script>
var EXPR=[{"fr":"On aura tout vu","lit":"همه‌چیز رو دیده خواهیم بود","fa":"برای ابرازِ <b>تعجب یا اعتراض</b> وقتی یه چیزِ عجیب یا باورنکردنی اتفاق می‌افته — یعنی «دیگه همه‌چیز رو دیدیم!» / «این دیگه نوبره!»","ex":[["Il veut se faire rembourser un cadeau qu'il a offert ? On aura tout vu !","می‌خواد پولِ کادویی که خودش داده رو پس بگیره؟ دیگه همه‌چی رو دیدیم!"],["Un chat qui fait du skateboard ? Alors là, on aura tout vu !","گربه‌ای که اسکیت‌بورد سواری می‌کنه؟ دیگه این نوبره!"],["Ils ferment la boulangerie pour ouvrir un parking ? On aura tout vu.","نونوایی رو می‌بندن که پارکینگ بزنن؟ دیگه همه‌چی رو دیدیم."]],"note":"برای ابرازِ حیرت یا نارضایتی از یه چیزِ نامعقول."},{"fr":"Ça me pèse","lit":"این برام سنگینی می‌کنه","fa":"وقتی یه چیزی <b>روی دوشِ آدم سنگینی می‌کنه</b> و آزارش می‌ده — چه یه مسئولیت، چه یه احساس، چه یه موقعیت.","ex":[["Cette dispute avec mon frère, ça me pèse vraiment.","این دعوا با برادرم واقعاً روی دوشمه."],["Le silence entre nous commence à me peser.","این سکوتِ بینمون داره کم‌کم اذیتم می‌کنه."],["Vivre loin de ma famille, ça me pèse de plus en plus.","دور از خانواده زندگی‌کردن هر روز برام سنگین‌تر می‌شه."]],"note":"برای بارِ عاطفی یا روانیِ یه موقعیت."},{"fr":"Faire une fixette (sur)","lit":"یه گیرِ ثابت زدن (روی چیزی)","fa":"یعنی <b>گیر دادن به یه چیز</b> یا وسواس پیدا کردن روش — وقتی فکرِ آدم مدام روی یه موضوع قفل می‌شه. (خودمونی)","ex":[["Elle fait une fixette sur son poids, c'est inquiétant.","روی وزنش گیر داده، نگران‌کننده‌ست."],["Arrête de faire une fixette sur cette erreur, ça arrive à tout le monde !","انقدر به این اشتباه گیر نده، برای همه پیش میاد!"],["Il fait une fixette sur une fille de sa classe.","روی یه دخترِ کلاسشون قفل کرده."]],"note":"خیلی خودمونی (familier) — برای وسواس یا گیرِ فکری."},{"fr":"Il m'a balancé","lit":"او منو پرت کرد / لو داد","fa":"دو معنی داره: ۱) <b>لو دادن، فروختن</b> کسی (خبرچینی) ۲) <b>یهو چیزی گفتن یا پرت‌کردن</b> به سمتِ کسی. (خودمونی)","ex":[["Il m'a balancé au prof, quel traître !","منو به معلم لو داد، چه خائنی!"],["Elle m'a balancé la vérité en pleine figure.","حقیقت رو یهو کوبید تو صورتم."],["Il m'a balancé les clés depuis la fenêtre.","کلیدها رو از پنجره پرت کرد سمتم."]],"note":"«balancer quelqu'un» = لو دادن؛ «balancer quelque chose» = پرت‌کردن/یهو گفتن."},{"fr":"Ne pas avoir la tête à…","lit":"سر به ... نداشتن","fa":"یعنی <b>حال‌وحوصله یا تمرکزِ یه کار رو نداشتن</b> چون فکرِ آدم جای دیگه‌ست — «حواسم به این نیست» / «تو حسش نیستم».","ex":[["Désolé, je n'ai pas la tête à faire la fête ce soir.","ببخشید، امشب حالِ مهمونی ندارم."],["Avec tous ces problèmes, il n'a pas la tête au travail.","با این همه مشکل، حواسش به کار نیست."],["Je n'ai pas la tête à ça maintenant, on en parle demain ?","الان حواسم به این نیست، فردا حرف بزنیم؟"]],"note":"برای نبودِ تمرکز یا حوصله به‌خاطرِ درگیریِ ذهنی."},{"fr":"Je lâche l'affaire","lit":"قضیه رو ول می‌کنم","fa":"یعنی <b>بی‌خیال شدن، ول کردن، تسلیم شدن</b> — وقتی آدم دیگه تلاش رو کنار می‌ذاره. (خودمونی)","ex":[["J'ai essayé dix fois, maintenant je lâche l'affaire.","ده بار امتحان کردم، دیگه بی‌خیالش می‌شم."],["Ne lâche pas l'affaire si près du but !","انقدر نزدیکِ هدف ول نکن!"],["Il a lâché l'affaire au bout de deux jours.","بعد از دو روز بی‌خیالش شد."]],"note":"خودمونی — معادلِ «رها کردن» یا «تسلیم شدن»."},{"fr":"Tourner en rond","lit":"دایره‌ای چرخیدن","fa":"یعنی <b>درجا زدن، دور خود چرخیدن، به‌جایی نرسیدن</b> — وقتی آدم پیشرفت نمی‌کنه یا تو یه بن‌بست گیر کرده.","ex":[["Ça fait une heure qu'on tourne en rond, on n'avance pas.","یه ساعته داریم درجا می‌زنیم، پیش نمی‌ریم."],["Sans nouvelles idées, le projet tourne en rond.","بدونِ ایده‌های تازه، پروژه درجا می‌زنه."],["Je tourne en rond dans cet appartement, j'ai besoin de sortir.","تو این آپارتمان دارم دور خودم می‌چرخم، باید برم بیرون."]],"note":"برای نبودِ پیشرفت یا حسِ گیرافتادن."},{"fr":"Être mort(e) de honte","lit":"از خجالت مُرده بودن","fa":"یعنی <b>از خجالت آب شدن، خیلی شرمنده شدن</b> — وقتی آدم انقدر خجالت می‌کشه که انگار می‌خواد آب بشه بره تو زمین.","ex":[["Quand je suis tombé devant tout le monde, j'étais mort de honte.","وقتی جلوی همه افتادم، از خجالت داشتم آب می‌شدم."],["Elle était morte de honte après son erreur en public.","بعد از اشتباهش جلوی جمع، از خجالت مرد."],["Mes parents ont raconté mes histoires d'enfance, j'étais mort de honte !","پدر و مادرم خاطرات بچگیم رو تعریف کردن، از خجالت آب شدم!"]],"note":"برای شرمِ شدید — «mort de» یعنی «به‌شدت»."},{"fr":"N'en déplaise à certains","lit":"هرچند بعضی‌ها خوششون نیاد","fa":"یعنی <b>با عرضِ معذرت از بعضی‌ها / چه بعضی‌ها خوششون بیاد چه نیاد</b> — وقتی آدم می‌خواد نظرش رو با قاطعیت بگه با اینکه می‌دونه بعضی‌ها مخالفن. (کمی ادبی)","ex":[["N'en déplaise à certains, la cuisine française reste la meilleure.","با عرضِ معذرت از بعضی‌ها، آشپزیِ فرانسوی هنوز بهترینه."],["N'en déplaise aux critiques, ce film est un chef-d'œuvre.","هرچند منتقدها خوششون نیاد، این فیلم یه شاهکاره."],["N'en déplaise à mes collègues, je pense qu'on se trompe.","با عرضِ معذرت از همکارام، فکر می‌کنم داریم اشتباه می‌کنیم."]],"note":"لحنِ کمی رسمی/ادبی — برای بیانِ نظر با وجودِ مخالفت."},{"fr":"Ne rien avoir là-dedans","lit":"این تو هیچی نداشتن","fa":"با اشاره به سر، یعنی <b>کله‌اش پوکه / چیزی حالیش نیست / باهوش نیست</b>. گاهی هم به‌معنیِ «تهش هیچی نیست». (خودمونی و کمی تند)","ex":[["Il est beau, mais il n'a rien là-dedans (en montrant sa tête).","خوش‌قیافه‌ست، ولی کله‌اش پوکه (با اشاره به سرش)."],["Ce discours est joli, mais il n'y a rien là-dedans.","این سخنرانی قشنگه، ولی تهش هیچی نداره."],["Ne te fie pas aux apparences : parfois, il n'y a rien là-dedans.","به ظاهر اعتماد نکن: بعضی وقتا تهش هیچی نیست."]],"note":"خودمونی و کمی تند — با اشاره به سر یعنی کم‌هوش."},{"fr":"Trois pelés et un tondu","lit":"سه تا کچل و یه تراشیده‌سر","fa":"یعنی <b>خیلی کم، تقریباً هیچ‌کس</b> — وقتی جایی خیلی خلوته و فقط چند نفر انگشت‌شمار اونجان.","ex":[["Il n'y avait que trois pelés et un tondu à la fête.","تو مهمونی فقط چند نفر انگشت‌شمار بودن."],["On a annulé le concert : trois pelés et un tondu étaient venus.","کنسرت رو لغو کردن؛ تقریباً هیچ‌کس نیومده بود."]],"note":"خودمونی (familier) — برای جمعِ خیلی کم."},{"fr":"Une grande gueule","lit":"یه دهن گنده","fa":"یعنی <b>آدمِ پرحرف و پررو</b> که بلند حرف می‌زنه و قُمپُز درمی‌کنه — ولی معمولاً پشت حرفش عمل نیست.","ex":[["C'est une grande gueule, mais il n'agit jamais.","خیلی زبونش درازه ولی هیچ‌وقت کاری نمی‌کنه."],["Arrête de faire ta grande gueule !","این‌قدر زبون‌درازی نکن!"]],"note":"خودمونی و گاهی توهین‌آمیز. «gueule» در اصل دهانِ حیوانه."},{"fr":"Mettre des bâtons dans les roues","lit":"چوب لای چرخ گذاشتن","fa":"یعنی <b>سنگ‌اندازی و مانع‌تراشی</b> برای کسی — دقیقاً مثل اصطلاح فارسیِ «چوب لای چرخ گذاشتن»!","ex":[["Mon collègue me met toujours des bâtons dans les roues.","همکارم همیشه برام سنگ‌اندازی می‌کنه."],["Au lieu de m'aider, tu me mets des bâtons dans les roues.","به‌جای کمک، چوب لای چرخم می‌ذاری."]],"note":"معنی‌اش با فارسی یکیه — راحت یادت می‌مونه."},{"fr":"Se jeter dans la gueule du loup","lit":"خودت رو توی دهنِ گرگ انداختن","fa":"یعنی <b>خود را به دلِ خطر انداختن</b>، با پای خود توی دردسر رفتن.","ex":[["Y aller seul, c'est se jeter dans la gueule du loup.","تنها رفتن یعنی خودت رو توی دلِ خطر انداختن."],["En signant ce contrat, il s'est jeté dans la gueule du loup.","با امضای این قرارداد، با پای خودش رفت توی دردسر."]],"note":"«gueule du loup» = دهانِ گرگ، نمادِ خطر."},{"fr":"Sage comme une image","lit":"آروم مثل یه عکس/تابلو","fa":"یعنی <b>خیلی آروم و سربه‌راه</b> — بیشتر برای بچه‌ها به کار می‌ره (مثل «بچه‌ی نازنین و حرف‌گوش‌کن»).","ex":[["Les enfants ont été sages comme des images.","بچه‌ها خیلی آروم و سربه‌راه بودن."],["Sois sage comme une image pendant la réunion.","تو جلسه آروم و سربه‌راه باش."]],"note":"همیشه مثبت و تعریف‌آمیزه."},{"fr":"Dormir à la belle étoile","lit":"زیرِ ستاره‌ی زیبا خوابیدن","fa":"یعنی <b>در فضای باز و زیرِ آسمون خوابیدن</b> (بدون سقف، توی طبیعت).","ex":[["On a dormi à la belle étoile au bord du lac.","کنار دریاچه زیرِ آسمون (تو فضای باز) خوابیدیم."],["J'adore dormir à la belle étoile en été.","عاشق اینم که تابستون زیرِ ستاره‌ها بخوابم."]],"note":"حس‌وحالِ شاعرانه و دل‌نشین داره."},{"fr":"Être bien dans ses baskets","lit":"توی کفش‌های کتانیِ خودت راحت بودن","fa":"یعنی <b>با خودت راحت و در آرامش بودن</b>، اعتمادبه‌نفس داشتن و حالت خوب بودن.","ex":[["Depuis qu'elle a changé de travail, elle est bien dans ses baskets.","از وقتی کارش رو عوض کرده، با خودش راحت و سرحاله."],["À cet âge, ce n'est pas facile d'être bien dans ses baskets.","تو این سن، با خود راحت بودن آسون نیست."]],"note":"خودمونی (familier). «baskets» = کفش کتانی."},{"fr":"Être tiré à quatre épingles","lit":"با چهار سنجاق کشیده‌شده","fa":"یعنی <b>خیلی شیک و مرتب لباس پوشیدن</b>، تروتمیز و بی‌نقص بودن.","ex":[["Il est toujours tiré à quatre épingles au bureau.","همیشه سرِ کار خیلی شیک و مرتبه."],["Pour le mariage, elle était tirée à quatre épingles.","برای عروسی خیلی شیک و آراسته بود."]],"note":"اشاره به سنجاق‌هایی که لباس را صاف و مرتب نگه می‌داشتند."},{"fr":"C'est du bidon","lit":"این بیدونه (حلب/قمقمه‌ست)","fa":"یعنی <b>این چرته / الکیه / قلابیه</b> — وقتی چیزی دروغ یا توخالی و بی‌ارزشه.","ex":[["Ne le crois pas, c'est du bidon.","باورش نکن، چرته/الکیه."],["Cette promesse, c'est du bidon.","این قول الکیه/توخالیه."]],"note":"خیلی خودمونی (familier)."},{"fr":"Avoir le cafard","lit":"سوسک داشتن (cafard = سوسک)","fa":"یعنی <b>دمغ و غمگین بودن</b>، حال‌وحوصله نداشتن و دل‌گرفته بودن.","ex":[["Il pleut et j'ai le cafard.","بارون میاد و دمغم/حالم گرفته‌ست."],["Depuis son départ, elle a le cafard.","از وقتی رفته، دلش گرفته و غمگینه."]],"note":"خیلی رایج. «cafard» در اصل یعنی سوسک."},{"fr":"Être à côté de la plaque","lit":"کنارِ پلاک بودن","fa":"یعنی <b>کاملاً اشتباه فهمیدن / پرت بودن</b> — وقتی کسی جوابِ بی‌ربط می‌ده یا اصلاً موضوع رو نگرفته.","ex":[["Désolé, j'étais complètement à côté de la plaque.","ببخشید، کاملاً پرت بودم / اشتباه فهمیده بودم."],["Ta réponse est à côté de la plaque, relis la question.","جوابت بی‌ربطه، دوباره سوال رو بخون."]],"note":"خودمونی (familier). برای جوابِ پرت یا برداشتِ غلط."},{"fr":"Être dans de beaux draps","lit":"توی ملافه‌های قشنگ بودن","fa":"یعنی <b>توی دردسرِ بزرگ افتادن / توی هچل بودن</b> — وضعیتِ سخت و ناجور. (طعنه‌آمیزه: «قشنگ» در واقع یعنی بد!)","ex":[["Si le patron l'apprend, on est dans de beaux draps.","اگه رئیس بفهمه، حسابی توی دردسر می‌افتیم."],["Sans billet ni passeport, te voilà dans de beaux draps !","بدون بلیط و پاسپورت، حالا توی هچل افتادی!"]],"note":"کنایه‌ای؛ «beaux» اینجا برعکسِ معنیِ واقعیه."},{"fr":"Mener la vie de château","lit":"زندگیِ قصر داشتن","fa":"یعنی <b>زندگیِ مرفه و پرتجمل داشتن</b> — مثل اشراف، بدون دغدغه‌ی پول.","ex":[["Depuis qu'il a gagné au loto, il mène la vie de château.","از وقتی لاتاری برده، زندگیِ شاهانه‌ای داره."],["En vacances, on a mené la vie de château une semaine.","تو تعطیلات یه هفته زندگیِ شاهانه کردیم."]],"note":"مثبت؛ نمادِ رفاه و آسایش."},{"fr":"En avoir ras le bol","lit":"تا لبِ کاسه پُر داشتن","fa":"یعنی <b>حسابی خسته/کلافه شدن، به ستوه آمدن</b> — وقتی دیگه تحملِ چیزی رو نداری («دیگه بسه!»).","ex":[["J'en ai ras le bol de ce bruit !","از این سروصدا دیگه به ستوه اومدم!"],["Elle en a ras le bol de toujours attendre.","از این‌که همیشه منتظر بمونه حسابی کلافه‌ست."]],"note":"خیلی رایج و خودمونی. اسمش هم هست: «le ras-le-bol»."},{"fr":"Raconter des salades","lit":"سالاد تعریف کردن","fa":"یعنی <b>دروغ گفتن / چاخان کردن، قصه ساختن</b> — وقتی کسی حرف‌های الکی و سرِهم‌بندی‌شده می‌زنه.","ex":[["Arrête de raconter des salades, dis la vérité !","انقدر چاخان نکن، راستش رو بگو!"],["Il raconte des salades pour se rendre intéressant.","قصه می‌سازه تا خودش رو مهم جلوه بده."]],"note":"خودمونی؛ مثلِ «داستان سرِهم کردن» در فارسی."}];
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function strip(t){return (t||'').replace(/<[^>]+>/g,'');}
var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
function card(e){
 var lit=e.lit?'<div class="elit"><span class="lbl">Mot à mot</span>'+esc(e.lit)+'</div>':'';
 var mean=e.fa?'<div class="emean">'+e.fa+'</div>':'';
 var exs='';
 (e.ex||[]).forEach(function(p){exs+='<div class="exrow"><div class="exfr">'+esc(p[0])+'</div><div class="exfa">'+esc(p[1])+'</div></div>';});
 if(exs) exs='<div class="exs">'+exs+'</div>';
 var note=e.note?'<div class="enote">'+e.note+'</div>':'';
 var s=strip(e.fr+' '+e.fa+' '+e.lit).toLowerCase();
 return '<div class="ecard" data-s="'+esc(s)+'"><button class="ehead" onclick="tog(this)"><span class="efr">'+esc(e.fr)+'</span><span class="echev">'+CHEV+'</span></button><div class="ebody">'+lit+mean+exs+note+'</div></div>';
}
document.getElementById('wrap').innerHTML=EXPR.map(card).join('');
function tog(b){b.parentElement.classList.toggle('open');}
var allOpen=false;
function toggleAll(){allOpen=!allOpen;document.querySelectorAll('.ecard').forEach(function(c){c.classList.toggle('open',allOpen);});document.getElementById('exp').textContent=allOpen?'Tout replier':'Tout déplier';}
var q=document.getElementById('q');
q.addEventListener('input',function(){var v=q.value.trim().toLowerCase();
 document.querySelectorAll('.ecard').forEach(function(c){c.style.display=(!v||c.dataset.s.indexOf(v)>-1)?'':'none';});});
</script>
<script>document.addEventListener("contextmenu",function(e){e.preventDefault();},{capture:true});</script>
</body></html>
