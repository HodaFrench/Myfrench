        <div class="row"><div class="row-lab">📖 ترجمه‌ی تحت‌اللفظی</div><span class="lit">${e.lit}</span></div>
        <div class="row"><div class="row-lab">💡 معنی واقعی</div><div class="mean">${e.fa}</div></div>
        <div class="row"><div class="row-lab">✍️ مثال</div><div class="exs">${e.ex.map(x=>`<div class="exline"><span class="f">${x[0]}</span><span class="p">${x[1]}</span></div>`).join('')}</div></div>
        <div class="note">📌 <span>${e.note}</span></div>
      </div></div>
    </div>`).join('');
}
function tog(i){document.querySelector('.ex-item[data-i="'+i+'"]').classList.toggle('open');}
render();
document.querySelector('.ex-item') && document.querySelector('.ex-item').classList.add('open');
</script>
<script>
/* hoda-protect: بازدارنده‌ی کپی (نه امنیت کامل) */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},{capture:true});
  document.addEventListener('selectstart',function(e){
    var t=e.target;
    // اجازه‌ی انتخاب در فیلدهای ورودی (مثل جستجو یا فرم سوال)
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    e.preventDefault();
  });
  document.addEventListener('copy',function(e){
    var t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    e.preventDefault();
  });
  document.addEventListener('keydown',function(e){
    var t=e.target;
    var inField=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    var k=(e.key||'').toLowerCase();
    // Ctrl/Cmd + C/X/U/S/A (کپی، برش، سورس، ذخیره، انتخاب‌همه) — خارج از فیلدها
    if((e.ctrlKey||e.metaKey)&&['c','x','u','s','a'].indexOf(k)>-1&&!inField){e.preventDefault();}
  },{capture:true});
})();
</script>
<style>
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
input,textarea,[contenteditable]{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
</style>
<script src="backbtn.js"></script>
</body>
