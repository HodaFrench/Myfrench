<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Français avec Hoda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1a73e8; --red:#ea4335; --green:#1e8e3e; --amber:#f9a825; --teal:#12a4b4;
    --purple:#9334e6; --orange:#e8710a; --pink:#d01884; --indigo:#3f51b5;
    --ink:#202124; --grey:#5f6368; --faint:#80868b; --line:#dadce0; --line-2:#e8eaed;
    --bg:#fff; --mist:#f8f9fa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  *{-webkit-user-select:none;user-select:none}
  input,textarea,[contenteditable]{user-select:text}
  img{pointer-events:none}
  body{font-family:'Lexend',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:0 0 60px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  svg{display:block}
  a{text-decoration:none;color:inherit}
  /* top bar */
  .top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;padding:0 20px;height:60px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;flex:none}
  .brand .mark i{display:block}
  .brand .mark i:nth-child(1){background:var(--blue)}.brand .mark i:nth-child(2){background:var(--red)}
  .brand .mark i:nth-child(3){background:var(--amber)}.brand .mark i:nth-child(4){background:var(--green)}
  .brand b{font-weight:700;font-size:16.5px;letter-spacing:-.3px}
  .back{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:#f1f3f4;color:#3c4043;border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
  .back:hover{background:#e8eaed}
  .back svg{width:16px;height:16px}
  @media(max-width:560px){.brand b{font-size:15px}}
  /* hero */
  .hero{text-align:center;padding:32px 20px 10px;max-width:680px;margin:0 auto}
  .hero .ic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:0 6px 18px rgba(60,64,67,.18)}
  .hero .ic svg{width:32px;height:32px}
  .hero h1{font-size:26px;font-weight:500;letter-spacing:-.4px}
  .hero .cnt{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:500;border-radius:999px;padding:5px 14px}
  /* grid */
  .grid{max-width:680px;margin:0 auto;padding:18px 16px}
  .card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:14px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(60,64,67,.06);transition:box-shadow .16s,transform .16s,border-color .16s}
  .card:hover{box-shadow:0 2px 8px rgba(60,64,67,.14),0 6px 18px rgba(60,64,67,.10);transform:translateY(-2px);border-color:var(--line)}
  .card:active{transform:scale(.995)}
  .card-cov{flex-shrink:0;width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;text-align:center}
  .card-cov svg{width:26px;height:26px}
  .card-cov img{width:100%;height:100%;object-fit:cover}
  .card-cov .txt{font-family:'Lexend',sans-serif;font-size:10px;font-weight:500;padding:4px;line-height:1.25;direction:ltr}
  .card-info{flex:1;min-width:0}
  .card-t{font-size:15px;font-weight:500;margin-bottom:2px;line-height:1.4}
  .card-fr{font-size:11.5px;color:var(--grey);direction:ltr;text-align:left;margin-bottom:4px}
  .card-lvl{display:inline-block;font-size:10.5px;font-weight:500;background:var(--mist);border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;color:var(--grey)}
  .card-arr{flex-shrink:0;color:var(--faint);display:flex;align-items:center}
  .card-arr svg{width:20px;height:20px}
  .empty{text-align:center;padding:56px 24px;color:var(--grey)}
  .empty .e{display:flex;justify-content:center;margin-bottom:14px;color:var(--faint)}
  .empty .e svg{width:44px;height:44px}
  .foot{text-align:center;font-size:13px;color:var(--faint);margin:18px 20px 0;padding:12px}
  .foot b{color:var(--grey);font-weight:500}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="index.html"><span class="mark"><i></i><i></i><i></i><i></i></span><b>Français avec Hoda</b></a>
    <button class="back" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Retour
    </button>
  </div>

  <div class="hero"><div class="ic" id="hic"></div><h1 id="htitle">…</h1><div class="cnt" id="hcnt"></div></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><b>Français avec Hoda</b></div>

<script src="data.js"></script>
<script>
function qs(k){return new URLSearchParams(location.search).get(k);}
var CAT=qs('cat'), SUB=qs('sub');

/* ─ icônes (SVG, sans emoji) ─ */
var I={
  vocab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.2-3.5-2-6-2v13c2.5 0 4.5.8 6 2M12 6c1.5-1.2 3.5-2 6-2v13c-2.5 0-4.5.8-6 2M12 6v13"/></svg>',
  grammar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a3 3 0 013 3v4a3 3 0 01-3 3H9l-4 3v-3a3 3 0 01-1-2V8a3 3 0 013-3z"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v4M9 21h6"/></svg>',
  ecoute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0116 0v1M4 13a2 2 0 002 2h1v-4H6a2 2 0 00-2 2zM20 13a2 2 0 01-2 2h-1v-4h1a2 2 0 012 2z"/></svg>',
  mini:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 01-2-2zM17 8h3v9a2 2 0 01-2 2M7 9h7M7 13h7M7 17h4"/></svg>',
  article:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
  culture:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10L12 4l8 6M5 10v9h14v-9M9 19v-5h6v5"/></svg>',
  pron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2l2-5 3 11 3-14 3 10 2-3h3"/></svg>',
  tcf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2 3 2 3H6"/></svg>'
};
var ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

var CAT_META={
  grammar:{fr:'Grammaire',ic:'grammar',color:'var(--red)'},
  vocab:{fr:'Vocabulaire',ic:'vocab',color:'var(--blue)'},
  miniarticle:{fr:'Mini-articles',ic:'mini',color:'var(--purple)'},
  innerfrench:{fr:'Compréhension',ic:'ecoute',color:'var(--teal)'},
  podcast:{fr:'Compréhension',ic:'ecoute',color:'var(--teal)'},
  article:{fr:'Articles',ic:'article',color:'var(--orange)'},
  culture:{fr:'Culture française',ic:'culture',color:'var(--indigo)'},
  image:{fr:'Expression orale',ic:'image',color:'var(--green)'},
  prononciation:{fr:'Prononciation',ic:'pron',color:'var(--pink)'},
  tcf:{fr:'TCF Canada',ic:'tcf',color:'var(--amber)'}
};
var DIRECT={debutant:'DEBUTANT_index.html',roulette:'ROULETTE.html',phrases:'PHRASES_utiles.html'};
var VOC_FOLDERS=[
  {sub:"mots_aujourdhui",fr:"Les mots d'aujourd'hui"},
  {sub:"thematique",fr:"Vocabulaire thématique"},
  {sub:"mots_info",fr:"Les mots de l'info"},
  {sub:"edito_a1",fr:"Edito A1"},
  {sub:"edito_a2",fr:"Edito A2"},
  {sub:"edito_b1",fr:"Edito B1"}
];
var VOCFOLD=VOC_FOLDERS;
var SPECIAL_SUB={mots_info:'MOTSINFO_index.html'};

function clean(t){return (t||'').replace(/[📐📚✍️🎧📰🗼🎯🎙️📸👤🟢🔵🟣🗞️🗂️📄📝📗📭]/g,'').trim();}
function esc(t){return (t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function goBack(){
  if(CAT==='vocab' && SUB){ location.href='CAT.html?cat=vocab'; return; }
  location.href='index.html';
}

function setHeader(fr,iconKey,color,cnt){
  document.getElementById('htitle').textContent=fr;
  document.getElementById('tl')&&(document.getElementById('tl').textContent=fr);
  var hic=document.getElementById('hic');
  hic.innerHTML=I[iconKey]||I.vocab;
  hic.style.background=color;
  var hc=document.getElementById('hcnt');
  hc.textContent=cnt;
  hc.style.background='var(--mist)';
  hc.style.border='1px solid var(--line-2)';
  hc.style.color=color;
  document.title=fr+' — Français avec Hoda';
}

/* covInner: HTML déjà construit (img / svg / texte) */
function makeCard(href,covStyle,covInner,title,fr,lvl){
  return '<a class="card" href="'+href+'"><div class="card-cov" style="'+covStyle+'">'+covInner+'</div>'+
    '<div class="card-info"><div class="card-t">'+esc(title)+'</div>'+
    (fr?'<div class="card-fr">'+esc(fr)+'</div>':'')+
    (lvl?'<span class="card-lvl">'+esc(lvl)+'</span>':'')+
    '</div><div class="card-arr">'+ARR+'</div></a>';
}
function covImg(src){return {style:'background:#eef1f4;padding:0',inner:'<img src="'+src+'">'};}
function covIcon(iconKey,color){return {style:'background:'+color,inner:I[iconKey]||I.vocab};}
function covText(txt,color){return {style:'background:'+color,inner:'<span class="txt">'+esc(txt)+'</span>'};}

function render(){
  var grid=document.getElementById('grid');
  // 1) sous-dossier vocabulaire -> leçons
  if(CAT==='vocab' && SUB){
    var fold=VOCFOLD.find(function(f){return f.sub===SUB;})||{fr:SUB};
    var items=(typeof LESSONS!=='undefined')?LESSONS.filter(function(l){return l.category==='vocab'&&l.sub===SUB;}):[];
    setHeader(fold.fr,'vocab','var(--blue)',items.length+' leçons');
    if(!items.length){grid.innerHTML=emptyHtml('Ce dossier est encore vide — bientôt disponible.');return;}
    var h='';
    items.forEach(function(l){
      var c=l.image?covImg(l.image):covText(clean(l.titleFr||l.title).substring(0,26),'var(--blue)');
      h+=makeCard(l.file||'#',c.style,c.inner,clean(l.title),l.titleFr||'',l.level||'');
    });
    grid.innerHTML=h; return;
  }
  // 2) vocabulaire -> dossiers
  if(CAT==='vocab'){
    setHeader('Vocabulaire','vocab','var(--blue)',VOCFOLD.length+' dossiers');
    var h='';
    VOCFOLD.forEach(function(f){
      var n=(typeof LESSONS!=='undefined')?LESSONS.filter(function(l){return l.category==='vocab'&&l.sub===f.sub;}).length:0;
      var href=SPECIAL_SUB[f.sub]?SPECIAL_SUB[f.sub]:'CAT.html?cat=vocab&sub='+f.sub;
      var c=covIcon('vocab','var(--blue)');
      h+=makeCard(href,c.style,c.inner,f.fr,'',n?n+' leçons':'bientôt');
    });
    grid.innerHTML=h; return;
  }
  // 3) redirections directes
  if(DIRECT[CAT]){ location.href=DIRECT[CAT]; return; }
  // 4) catégories normales
  var meta=CAT_META[CAT]||{fr:CAT,ic:'vocab',color:'var(--blue)'};
  var h='';
  if(CAT==='grammar'){
    h+=makeCard('GRAMMAIRE_DIALOGUE_index.html','background:linear-gradient(135deg,#ea4335,#c5221f)',I.grammar,'Grammaire en Dialogue','Le livre complet','32 chapitres');
  }
  if(CAT==='innerfrench' && typeof INNERFRENCH!=='undefined'){
    setHeader(meta.fr,meta.ic,meta.color,INNERFRENCH.length+' épisodes');
    INNERFRENCH.forEach(function(e){
      var c=covIcon('ecoute','var(--teal)');
      h+=makeCard('IF_ep'+String(e.num).padStart(2,'0')+'.html',c.style,c.inner,e.titreFa,'','Épisode '+e.num);
    });
    grid.innerHTML=h; return;
  }
  if(CAT==='miniarticle' && typeof MINIARTICLES!=='undefined'){
    setHeader(meta.fr,meta.ic,meta.color,MINIARTICLES.length+' articles');
    MINIARTICLES.forEach(function(m,idx){
      var href='MINI_'+String(idx).padStart(3,'0')+'.html';
      var c=covText((m.titre||'').substring(0,26),'var(--purple)');
      h+=makeCard(href,c.style,c.inner,m.titre||'','',m.niveau||'');
    });
    grid.innerHTML=h; return;
  }
  // normal
  var items=(typeof LESSONS!=='undefined')?LESSONS.filter(function(l){return l.category===CAT;}):[];
  setHeader(meta.fr,meta.ic,meta.color,items.length+' contenus');
  items.forEach(function(l){
    var c=l.image?covImg(l.image):covText(clean(l.titleFr||l.title).substring(0,26),meta.color);
    h+=makeCard(l.file||'#',c.style,c.inner,clean(l.title),l.titleFr||'',l.level||'');
  });
  if(!items.length && CAT!=='grammar'){grid.innerHTML=emptyHtml('Aucun contenu trouvé.');return;}
  grid.innerHTML=h;
}
function emptyHtml(msg){
  return '<div class="empty"><div class="e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h4l2 3h4l2-3h4M4 13l2.5-7h11L20 13v5a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg></div>'+msg+'</div>';
}
document.addEventListener('DOMContentLoaded',render);
</script>
<script>(function(){document.addEventListener("contextmenu",function(e){e.preventDefault();},{capture:true});document.addEventListener("copy",function(e){var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;e.preventDefault();});document.addEventListener("keydown",function(e){var t=e.target;var f=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);var k=(e.key||"").toLowerCase();if((e.ctrlKey||e.metaKey)&&["c","x","u","s","a"].indexOf(k)>-1&&!f){e.preventDefault();}},{capture:true});})();</script>
</body></html>
